name: validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh scripts/templates/*.sh
      - name: Reject private-environment markers
        run: |
          ! grep -RInE 'BEGIN (RSA|OPENSSH) PRIVATE KEY|SecretAccessKey|192\.168\.|200\.152\.' . \
            --exclude-dir=.git --exclude=validate.yml
